pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }

// Android Studio Gradle does not inherit the shell PATH, so `npx` cannot find node.
def nodeBinary = [
    System.getenv("NODE_BINARY"),
    "/opt/homebrew/bin/node",
    "/usr/local/bin/node",
].find { candidate -> candidate != null && new File(candidate).canExecute() } ?: "node"

def cliBin = new File(
    settings.layout.rootDirectory.dir("../node_modules/@react-native-community/cli/build/bin.js").asFile.path,
)
def autolinkCommand = nodeBinary != "node" && cliBin.exists()
    ? [nodeBinary, cliBin.absolutePath, "config"]
    : ["npx", "@react-native-community/cli", "config"]

gradle.ext.nodeBinary = nodeBinary

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(autolinkCommand)
}
rootProject.name = 'USee'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
