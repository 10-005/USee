apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://lab.ssafy.com/s15-final/S15P31D106.git
    targetRevision: infra
    path: infra/services/core-api/overlays/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
