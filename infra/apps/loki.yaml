# 로그 저장소(S15P31D106-423). Grafana Explore에서 {namespace="app", app="core-api"}처럼 조회
# 노드 1에 단일 바이너리(Monolithic) 1개, 파일 저장(PVC), 7일 보관. 수집은 alloy.yaml
# OSS Loki 차트는 grafana-community로 옮겨졌다(grafana/loki는 Enterprise Logs용)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 21.2.3
    helm:
      valuesObject:
        deploymentMode: Monolithic
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2026-11-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: loki_index_, period: 24h }
          limits_config:
            retention_period: 168h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          pattern_ingester:
            enabled: false
        singleBinary:
          replicas: 1
          nodeSelector:
            role: primary
          persistence:
            size: 10Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
        # 단일 바이너리만 쓰므로 나머지 구성 요소·캐시·게이트웨이·점검용 Pod는 끈다
        read: { replicas: 0 }
        write: { replicas: 0 }
        backend: { replicas: 0 }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        gateway: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        sidecar:
          rules: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
