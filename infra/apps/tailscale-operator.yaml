# Tailscale Kubernetes Operator: 클러스터 Service·Ingress를 tailnet에만 노출 (인터넷 공개 없음)
# OAuth 자격 증명은 Secret operator-oauth(namespace tailscale)를 미리 만들어 둔다 (platform/secrets/tailscale-operator-oauth.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.104.1
    helm:
      valuesObject:
        operatorConfig:
          hostname: k15-operator
          defaultTags:
            - "tag:k8s-operator"
        proxyConfig:
          defaultTags: "tag:k8s"
        # k8s API를 tailnet에 노출하지 않음
        apiServerProxyConfig:
          mode: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
