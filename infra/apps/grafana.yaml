# 메트릭 대시보드(S15P31D106-423 4단계). tailnet 전용 https://grafana.<tailnet>.ts.net
# 데이터소스·대시보드·경보 규칙은 values로 만들어 PVC 없이 둔다
# 관리자 계정은 SealedSecret grafana-admin(infra/scripts/gen-grafana-admin-secret.sh)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.4.1
    helm:
      valuesObject:
        nodeSelector:
          role: primary
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 384Mi}
        persistence:
          enabled: false
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        envValueFrom:
          MATTERMOST_WEBHOOK_URL:
            secretKeyRef:
              name: grafana-mattermost
              key: webhook-url
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                # 19004는 ${DS_PROMETHEUS}를 uid로, 4701은 이름으로 찾으므로 이름과 uid를 같게 둔다
                uid: Prometheus
                type: prometheus
                url: http://prometheus-server.monitoring.svc
                access: proxy
                isDefault: true
              # 서비스 로그(loki.yaml, alloy.yaml). Explore에서 {namespace="app", app="core-api"}
              - name: Loki
                uid: Loki
                type: loki
                url: http://loki.monitoring.svc:3100
                access: proxy
        alerting:
          mattermost.yaml:
            apiVersion: 1
            contactPoints:
              - orgId: 1
                name: Mattermost Operations
                receivers:
                  - uid: s15-mattermost-ops
                    type: slack
                    settings:
                      url: $MATTERMOST_WEBHOOK_URL
                      title: '{{ `{{ template "s15.mattermost.title" . }}` }}'
                      text: '{{ `{{ template "s15.mattermost.text" . }}` }}'
            templates:
              - orgId: 1
                name: s15-mattermost-ko
                # Helm을 거친 뒤 Grafana가 Go 템플릿을 실행한다.
                template: |
                  {{ `{{ define "s15.mattermost.title" -}}
                  {{ if eq .Status "resolved" }}[복구]{{ else }}[경보]{{ end }} {{ if eq .CommonLabels.alertname "DatasourceError" }}경보 평가 오류{{ else if eq .CommonLabels.alertname "DatasourceNoData" }}경보 데이터 없음{{ else }}{{ with .CommonAnnotations.alert_title }}{{ . }}{{ else }}운영 상태 확인{{ end }}{{ end }}
                  {{- end }}

                  {{ define "s15.mattermost.text" -}}
                  {{ range .Alerts -}}
                  *상태* {{ if eq .Status "resolved" }}복구됨{{ else }}발생{{ end }}
                  *발생 시각* {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05 MST" }}
                  {{ if and (eq .Status "resolved") (not .EndsAt.IsZero) }}*복구 시각* {{ .EndsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05 MST" }}
                  {{ end -}}
                  {{ if .Labels.deployment }}*대상* {{ with .Labels.namespace }}{{ . }}/{{ end }}{{ .Labels.deployment }}
                  {{ else if .Labels.instance }}*대상* {{ .Labels.instance }}
                  {{ else if .Labels.rulename }}*경보 규칙* {{ .Labels.rulename }}
                  {{ end -}}
                  {{ if eq .Labels.alertname "DatasourceError" }}*경보 코드* S15-GRAFANA-ERROR
                  *감지 원인* 데이터 소스 쿼리 실행 중 오류가 발생했습니다. Grafana의 규칙 상세에서 오류를 확인하세요.
                  {{ else if eq .Labels.alertname "DatasourceNoData" }}*경보 코드* S15-GRAFANA-NODATA
                  *감지 원인* 경보를 평가할 지표를 받지 못했습니다. 데이터 소스와 수집 상태를 확인하세요.
                  {{ else -}}
                  *경보 코드* {{ with .Annotations.error_code }}{{ . }}{{ else }}미지정{{ end }}
                  *감지 원인* {{ with .Annotations.summary }}{{ . }}{{ else }}Grafana의 경보 규칙 상세를 확인하세요.{{ end }}
                  {{ with .Annotations.description }}*확인 방법* {{ . }}
                  {{ end -}}
                  {{ end -}}
                  {{ $http := or (index .Labels "http_status_code") (index .Labels "status_code") }}{{ if match "^[1-5][0-9]{2}$" $http }}*HTTP 상태* {{ $http }}
                  {{ end -}}

                  {{ end -}}
                  {{ end }}` }}
          node-disk.yaml:
            apiVersion: 1
            groups:
              - orgId: 1
                name: node-disk
                folder: Infrastructure
                interval: 1m
                rules:
                  - uid: node-root-disk-usage
                    title: Node root filesystem usage is high
                    condition: B
                    for: 10m
                    noDataState: NoData
                    execErrState: Error
                    labels:
                      severity: warning
                    notification_settings:
                      receiver: Mattermost Operations
                    annotations:
                      alert_title: 노드 루트 디스크 사용량 초과
                      error_code: S15-DISK-001
                      summary: 루트 디스크 사용률이 10분 동안 80% 이상입니다.
                      description: 경보의 instance를 확인하고 해당 노드에서 df -h /로 사용량을 점검합니다.
                    data:
                      - refId: A
                        datasourceUid: Prometheus
                        relativeTimeRange: {from: 600, to: 0}
                        model:
                          refId: A
                          datasource: {type: prometheus, uid: Prometheus}
                          instant: true
                          range: false
                          # df와 동일하게 예약 블록을 제외한 공간에서 사용률을 계산한다.
                          expr: >-
                            100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / (
                              node_filesystem_avail_bytes{mountpoint="/"}
                              + (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"})
                            ))
                      - refId: B
                        datasourceUid: __expr__
                        relativeTimeRange: {from: 0, to: 0}
                        model:
                          refId: B
                          datasource: {type: __expr__, uid: __expr__}
                          type: threshold
                          expression: A
                          conditions:
                            - evaluator: {type: gte, params: [80]}
                              operator: {type: and}
                              query: {params: [B]}
                              reducer: {type: last, params: []}
                              type: query
                  - uid: app-deployment-no-available-replicas
                    title: App deployment has no available replicas
                    condition: B
                    for: 5m
                    noDataState: NoData
                    execErrState: Error
                    labels:
                      severity: critical
                    notification_settings:
                      receiver: Mattermost Operations
                    annotations:
                      alert_title: 앱 가용 복제본 없음
                      error_code: S15-APP-001
                      summary: app 네임스페이스의 Deployment에 5분 동안 가용 복제본이 없습니다.
                      description: 경보의 deployment와 namespace를 확인하고 Pod 상태 및 이벤트를 점검합니다.
                    data:
                      - refId: A
                        datasourceUid: Prometheus
                        relativeTimeRange: {from: 300, to: 0}
                        model:
                          refId: A
                          datasource: {type: prometheus, uid: Prometheus}
                          instant: true
                          range: false
                          expr: >-
                            kube_deployment_status_replicas_available{namespace="app",deployment=~"core-api|chat|notification|simulation|breed-server|match-worker-(cat|dog)"}
                            and on (namespace, deployment)
                            (kube_deployment_spec_replicas{namespace="app",deployment=~"core-api|chat|notification|simulation|breed-server|match-worker-(cat|dog)"} > 0)
                      - refId: B
                        datasourceUid: __expr__
                        relativeTimeRange: {from: 0, to: 0}
                        model:
                          refId: B
                          datasource: {type: __expr__, uid: __expr__}
                          type: threshold
                          expression: A
                          conditions:
                            - evaluator: {type: lt, params: [1]}
                              operator: {type: and}
                              query: {params: [B]}
                              reducer: {type: last, params: []}
                              type: query
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: true
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
        # grafana.com 공개 대시보드를 기동 시 내려받는다
        # revision을 안 적으면 1번(가장 옛 판)을 받는다. datasource를 문자열로 주면 한 줄짜리 "datasource": 만 바꿔서
        # 여러 줄 객체({uid: ${DS_PROMETHEUS}})가 그대로 남으므로, 목록 형식으로 ${DS_PROMETHEUS} 자체를 치환한다
        dashboards:
          default:
            spring-boot:
              gnetId: 19004 # Spring Boot 3.x Statistics: HTTP 지연·오류, HikariCP, JVM
              revision: 1
              datasource:
                - { name: DS_PROMETHEUS, value: Prometheus }
            jvm-micrometer:
              gnetId: 4701 # JVM (Micrometer)
              revision: 10
              datasource:
                - { name: DS_PROMETHEUS, value: Prometheus }
            node-exporter:
              gnetId: 1860 # Node Exporter Full: 노드 CPU·메모리·디스크. 자체 데이터소스 변수(기본값)를 써서 치환 불필요
              revision: 46
            # 서비스 로그(Loki). 네임스페이스·서비스를 고르고 검색어로 거른다. 라벨은 alloy.yaml의 relabel과 맞춘다
            service-logs:
              json: |
                {
                  "title": "서비스 로그",
                  "uid": "service-logs",
                  "schemaVersion": 39,
                  "time": { "from": "now-1h", "to": "now" },
                  "refresh": "30s",
                  "templating": { "list": [
                    { "name": "namespace", "label": "네임스페이스", "type": "query",
                      "datasource": { "type": "loki", "uid": "Loki" },
                      "query": "label_values(namespace)", "refresh": 2,
                      "current": { "text": "app", "value": "app" } },
                    { "name": "app", "label": "서비스", "type": "query",
                      "datasource": { "type": "loki", "uid": "Loki" },
                      "query": "label_values({namespace=~\"$namespace\"}, app)", "refresh": 2,
                      "multi": true, "includeAll": true, "allValue": ".+",
                      "current": { "text": "All", "value": "$__all" } },
                    { "name": "search", "label": "검색어(traceId 등)", "type": "textbox", "query": "",
                      "current": { "text": "", "value": "" } }
                  ] },
                  "panels": [
                    { "type": "timeseries", "title": "서비스별 로그 양",
                      "gridPos": { "x": 0, "y": 0, "w": 12, "h": 7 },
                      "datasource": { "type": "loki", "uid": "Loki" },
                      "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } }, "overrides": [] },
                      "targets": [ { "refId": "A", "legendFormat": "{{app}}",
                        "expr": "sum by (app) (count_over_time({namespace=~\"$namespace\", app=~\"$app\"} |= \"$search\" [$__interval]))" } ] },
                    { "type": "timeseries", "title": "서비스별 ERROR·WARN 수",
                      "gridPos": { "x": 12, "y": 0, "w": 12, "h": 7 },
                      "datasource": { "type": "loki", "uid": "Loki" },
                      "fieldConfig": { "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } }, "overrides": [] },
                      "targets": [ { "refId": "A", "legendFormat": "{{app}} {{level}}",
                        "expr": "sum by (app, level) (count_over_time({namespace=~\"$namespace\", app=~\"$app\"} |= \"$search\" |~ `(?:^|\\s|\"level\":\")(ERROR|WARN|WARNING)(?:\"|:?\\s)` | regexp `(?:^|\\s|\"level\":\")(?P<level>ERROR|WARN|WARNING)(?:\"|:?\\s)` [$__interval]))" } ] },
                    { "type": "logs", "title": "오류 로그(ERROR: Spring 텍스트·JSON, Python ERROR:·CRITICAL:)",
                      "gridPos": { "x": 0, "y": 7, "w": 24, "h": 9 },
                      "datasource": { "type": "loki", "uid": "Loki" },
                      "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
                      "targets": [ { "refId": "A",
                        "expr": "{namespace=~\"$namespace\", app=~\"$app\"} |= \"$search\" |~ `(?:^|\\s|\"level\":\")(ERROR|CRITICAL)(?:\"|:?\\s)`" } ] },
                    { "type": "logs", "title": "전체 로그",
                      "gridPos": { "x": 0, "y": 16, "w": 24, "h": 16 },
                      "datasource": { "type": "loki", "uid": "Loki" },
                      "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
                      "targets": [ { "refId": "A",
                        "expr": "{namespace=~\"$namespace\", app=~\"$app\"} |= \"$search\"" } ] }
                  ]
                }
        extraObjects:
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: grafana-tailnet
              namespace: monitoring
              annotations:
                # ArgoCD 화면과 같은 대상(팀원)이 보므로 같은 태그·ACL을 쓴다
                tailscale.com/tags: "tag:svc-argocd"
            spec:
              ingressClassName: tailscale
              defaultBackend:
                service:
                  name: grafana
                  port:
                    number: 80
              tls:
                - hosts:
                    - grafana
        testFramework:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
