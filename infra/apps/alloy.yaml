# 로그 수집기(S15P31D106-423). 노드마다 1개(DaemonSet)가 그 노드의 /var/log/pods 파일을 직접 읽어 Loki로 보낸다
# Kubernetes API로 읽으면(loki.source.kubernetes) kubelet이 컨테이너마다 inotify를 열어
# 노드 1의 root inotify 한도(128)를 다 써 버렸다 → 파일을 폴링으로 읽는 방식으로 바꿨다
# 대상: app·data 네임스페이스. /var/log는 읽기 전용 마운트
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.16.0
    helm:
      valuesObject:
        controller:
          type: daemonset
        crds:
          create: false
        alloy:
          enableReporting: false
          mounts:
            varlog: true
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          configMap:
            content: |
              // 이 노드에 뜬 Pod만
              discovery.kubernetes "pods" {
                role = "pod"
                namespaces {
                  names = ["app", "data"]
                }
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("HOSTNAME")  // 차트가 HOSTNAME에 노드 이름을 넣는다
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                // 퇴거(Evicted)·종료된 옛 Pod는 뺀다
                rule {
                  source_labels = ["__meta_kubernetes_pod_phase"]
                  regex         = "Failed|Succeeded"
                  action        = "drop"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                // kubelet 로그 파일 위치: /var/log/pods/<ns>_<pod>_<uid>/<container>/<n>.log
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pods" {
                path_targets = discovery.relabel.pods.output
              }

              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.process.pods.receiver]
              }

              loki.process "pods" {
                // containerd 로그 형식(시각 stream 플래그 본문)에서 본문만 남긴다
                stage.cri {}
                // breed-server 등 Python 서버의 헬스 체크 접근 로그(대부분의 줄)는 버린다
                stage.drop {
                  expression = "\"GET /health HTTP"
                }
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
