apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: simulation
  namespace: app
spec:
  entryPoints:
    - websecure
  routes:
    # Public API routing excludes OpenAPI even if the auth middleware is unavailable.
    - match: Host(`k15d106.p.ssafy.io`) && PathPrefix(`/api/simulation`) && !PathPrefix(`/api/simulation/v3/api-docs`)
      kind: Rule
      services:
        - name: simulation
          port: 8083
    - match: Host(`k15d106.p.ssafy.io`) && (PathPrefix(`/api/simulation/v3/api-docs`) || Path(`/swagger-ui/openapi/simulation`) || Path(`/swagger-ui/openapi/simulation.yaml`) || PathPrefix(`/swagger-ui/openapi/simulation/`))
      kind: Rule
      middlewares:
        - name: swagger-docs-auth
        - name: swagger-docs-path
      services:
        - name: simulation
          port: 8083
  tls: {}
