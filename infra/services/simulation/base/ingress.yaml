# 컨트롤러가 /api/simulation/v1/... 로 매핑되어 있으므로 경로를 자르지 않고 그대로 전달(S15P31D106-286)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simulation
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - host: k15d106.p.ssafy.io
      http:
        paths:
          - path: /api/simulation
            pathType: Prefix
            backend:
              service:
                name: simulation
                port:
                  number: 8083
