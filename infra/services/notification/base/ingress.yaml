apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: notification
  namespace: app
spec:
  entryPoints:
    - websecure
  routes:
    # Public API routing excludes OpenAPI even if the auth middleware is unavailable.
    - match: Host(`k15d106.p.ssafy.io`) && PathPrefix(`/api/notification`) && !PathPrefix(`/api/notification/v3/api-docs`)
      kind: Rule
      services:
        - name: notification
          port: 8082
    - match: Host(`k15d106.p.ssafy.io`) && (PathPrefix(`/api/notification/v3/api-docs`) || Path(`/swagger-ui/openapi/notification`) || Path(`/swagger-ui/openapi/notification.yaml`) || PathPrefix(`/swagger-ui/openapi/notification/`))
      kind: Rule
      middlewares:
        - name: swagger-docs-auth
        - name: swagger-docs-path
      services:
        - name: notification
          port: 8082
  tls: {}
