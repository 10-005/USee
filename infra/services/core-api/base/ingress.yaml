apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: core-api
  namespace: app
spec:
  entryPoints:
    - websecure
  routes:
    # Public API routing excludes OpenAPI even if the auth middleware is unavailable.
    - match: Host(`k15d106.p.ssafy.io`) && Method(`POST`) && (Path(`/api/core/v1/auth/local/login`) || Path(`/api/core/v1/auth/local/login/`))
      kind: Rule
      middlewares:
        - name: local-login-rate-bucket
        - name: local-login-rate-limit
        - name: local-login-rate-bucket-cleanup
      services:
        - name: core-api
          port: 8080
    - match: Host(`k15d106.p.ssafy.io`) && PathPrefix(`/api/core`) && !PathPrefix(`/api/core/v3/api-docs`) && !(Method(`POST`) && (Path(`/api/core/v1/auth/local/login`) || Path(`/api/core/v1/auth/local/login/`)))
      kind: Rule
      services:
        - name: core-api
          port: 8080
    - match: Host(`k15d106.p.ssafy.io`) && (PathPrefix(`/api/core/v3/api-docs`) || Path(`/swagger-ui/openapi/core`) || Path(`/swagger-ui/openapi/core.yaml`) || PathPrefix(`/swagger-ui/openapi/core/`))
      kind: Rule
      middlewares:
        - name: swagger-docs-auth
        - name: swagger-docs-path
      services:
        - name: core-api
          port: 8080
    - match: Host(`k15d106.p.ssafy.io`) && PathPrefix(`/swagger-ui`) && !PathPrefix(`/swagger-ui/openapi/`)
      kind: Rule
      middlewares:
        - name: swagger-docs-auth
      services:
        - name: core-api
          port: 8080
  tls: {}
