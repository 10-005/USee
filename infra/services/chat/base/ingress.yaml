apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chat
  namespace: app
spec:
  entryPoints:
    - websecure
  routes:
    # Public API routing excludes OpenAPI even if the auth middleware is unavailable.
    - match: Host(`k15d106.p.ssafy.io`) && PathPrefix(`/api/chat`) && !PathPrefix(`/api/chat/v3/api-docs`)
      kind: Rule
      services:
        - name: chat
          port: 8081
    - match: Host(`k15d106.p.ssafy.io`) && (PathPrefix(`/api/chat/v3/api-docs`) || Path(`/swagger-ui/openapi/chat`) || Path(`/swagger-ui/openapi/chat.yaml`) || PathPrefix(`/swagger-ui/openapi/chat/`))
      kind: Rule
      middlewares:
        - name: swagger-docs-auth
        - name: swagger-docs-path
      services:
        - name: chat
          port: 8081
  tls: {}
