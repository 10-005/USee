# 컨트롤러가 /api/chat/v1/... 로 매핑되어 있으므로 경로를 자르지 않고 그대로 전달(S15P31D106-286)
# WebSocket(/api/chat/v1/ws)도 같은 경로로 들어온다. Traefik은 Upgrade 헤더를 그대로 넘겨 별도 설정이 필요 없다(S15P31D106-288)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - host: k15d106.p.ssafy.io
      http:
        paths:
          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: chat
                port:
                  number: 8081
