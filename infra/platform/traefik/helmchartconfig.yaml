apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          tls:
            enabled: true
    # 클라이언트 IP 보존(S15P31D106-423). Cluster(기본)면 k3s ServiceLB(svclb)가 출발지를 SNAT해
    # Traefik과 앱의 X-Forwarded-For에 svclb Pod IP가 찍힌다. Local은 그 노드의 Traefik으로만 보내며 SNAT하지 않는다
    # Traefik은 노드 1에만 있으므로 노드 2 주소로 들어온 80·443은 받지 않는다(도메인은 노드 1)
    service:
      spec:
        externalTrafficPolicy: Local
