apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      file:
        enabled: true
        content: |-
          http:
            middlewares:
              security-headers:
                headers:
                  stsSeconds: 31536000
                  stsIncludeSubdomains: true
                  contentTypeNosniff: true
                  frameDeny: true
                  referrerPolicy: strict-origin-when-cross-origin
    service:
      spec:
        allocateLoadBalancerNodePorts: false
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          middlewares:
            - security-headers@file
          tls:
            enabled: true
