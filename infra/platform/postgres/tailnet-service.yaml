# tailnet 전용 노출 (animal-db.<tailnet>.ts.net:5432). 기존 postgres Service는 headless라 Operator가 지원하지 않아 따로 둔다
# 접근 제한은 Tailscale ACL(tag:svc-db, tcp:5432)과 DB 롤(dev_readonly)로 한다
apiVersion: v1
kind: Service
metadata:
  name: postgres-tailnet
  namespace: data
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: animal-db
    tailscale.com/tags: "tag:svc-db"
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
