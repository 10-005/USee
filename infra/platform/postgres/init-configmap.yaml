apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: data
data:
  01-init.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
    CREATE ROLE core_app LOGIN PASSWORD '${CORE_APP_PASSWORD}';
    CREATE ROLE chat_app LOGIN PASSWORD '${CHAT_APP_PASSWORD}';
    CREATE ROLE notification_app LOGIN PASSWORD '${NOTIFICATION_APP_PASSWORD}';
    CREATE ROLE simulation_app LOGIN PASSWORD '${SIMULATION_APP_PASSWORD}';

    REVOKE ALL ON DATABASE animal FROM PUBLIC;
    GRANT CONNECT ON DATABASE animal TO core_app, chat_app, notification_app, simulation_app;
    REVOKE ALL ON SCHEMA public FROM PUBLIC;

    CREATE SCHEMA core AUTHORIZATION core_app;
    CREATE SCHEMA chat AUTHORIZATION chat_app;
    CREATE SCHEMA notification AUTHORIZATION notification_app;
    CREATE SCHEMA simulation AUTHORIZATION simulation_app;

    ALTER ROLE core_app SET search_path = core;
    ALTER ROLE chat_app SET search_path = chat;
    ALTER ROLE notification_app SET search_path = notification;
    ALTER ROLE simulation_app SET search_path = simulation;

    GRANT USAGE ON SCHEMA core TO chat_app, notification_app, simulation_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE core_app IN SCHEMA core
      GRANT SELECT, REFERENCES ON TABLES TO chat_app, notification_app, simulation_app;

    GRANT USAGE ON SCHEMA chat TO notification_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE chat_app IN SCHEMA chat
      GRANT SELECT ON TABLES TO notification_app;

    -- 팀원 조회용 읽기 전용 계정. 이미 초기화된 DB에는 scripts/create-dev-readonly-role.sh로 만든다
    CREATE ROLE dev_readonly LOGIN PASSWORD '${DEV_READONLY_PASSWORD}' CONNECTION LIMIT 5;
    GRANT CONNECT ON DATABASE animal TO dev_readonly;
    GRANT pg_read_all_data TO dev_readonly;
    -- 다른 계정의 쿼리 문구까지 pg_stat_statements로 볼 수 있게 한다(S15P31D106-423)
    GRANT pg_read_all_stats TO dev_readonly;
    ALTER ROLE dev_readonly SET default_transaction_read_only = on;
    ALTER ROLE dev_readonly SET statement_timeout = '30s';

    -- AI 매칭 워커(match-worker) 전용. 벡터(pgvector)를 ai 스키마에만 저장한다. 이미 초기화된 DB에는 scripts/create-ai-schema.sh로 만든다
    -- 확장은 public에 두고 ai_app에만 public USAGE를 준다(vector 타입·<=> 연산자 사용)
    CREATE EXTENSION IF NOT EXISTS vector;
    -- 슬로우 쿼리 분석(S15P31D106-423). statefulset의 shared_preload_libraries와 짝
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    CREATE ROLE ai_app LOGIN PASSWORD '${AI_APP_PASSWORD}';
    GRANT CONNECT ON DATABASE animal TO ai_app;
    GRANT USAGE ON SCHEMA public TO ai_app;
    CREATE SCHEMA ai AUTHORIZATION ai_app;
    ALTER ROLE ai_app SET search_path = ai, public;
    EOSQL
