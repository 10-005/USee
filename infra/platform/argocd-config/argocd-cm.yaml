# 백엔드 팀원 공용 읽기 전용 계정. 비밀번호는 Git에 두지 않고 admin이 argocd account update-password로 설정
# Prune·Delete=false: 앱을 지우거나 되돌려도 ArgoCD 설정 자체는 지우지 않음
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  accounts.backend: login
