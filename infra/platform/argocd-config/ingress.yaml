# tailnet 전용 ArgoCD 화면 (https://argocd.<tailnet>.ts.net). 인증서는 Tailscale이 발급
# 백엔드 포트 443이라 프록시가 https+insecure로 argocd-server에 연결 → server.insecure 설정 불필요
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-tailnet
  namespace: argocd
  annotations:
    tailscale.com/tags: "tag:svc-argocd"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 443
  tls:
    - hosts:
        - argocd
