# policy.default는 두지 않음: 새 계정이 자동으로 권한을 받지 않게 계정마다 명시
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  policy.csv: |
    g, backend, role:readonly
