server:
  port: 8080

spring:
  application:
    name: core-api
  profiles:
    default: local
  config:
    # backend/.env (bootRun은 모듈 폴더, IDE는 backend 폴더에서 실행될 수 있어 둘 다 시도)
    import: optional:file:.env[.properties],optional:file:../.env[.properties],classpath:common.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: core
        jdbc:
          time_zone: Asia/Seoul

api:
  prefix: /api/core
  docs-hub: true   # dev에서 4개 서비스 문서를 묶은 /swagger-ui를 띄운다

jwt:
  public-key: ${JWT_PUBLIC_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:animal}?currentSchema=core
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
