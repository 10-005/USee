server:
  port: 8083

spring:
  application:
    name: simulation
  profiles:
    default: local
  config:
    # backend/.env (bootRun은 모듈 폴더, IDE는 backend 폴더에서 실행될 수 있어 둘 다 시도)
    import: optional:file:.env[.properties],optional:file:../.env[.properties],classpath:common.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: simulation
        jdbc:
          time_zone: Asia/Seoul
  # simulation 스키마 DDL·시드(db/migration, Q412). core 테이블(animal_breeds 등)은 읽기 전용 JOIN만
  flyway:
    schemas: simulation
    create-schemas: false
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true   # 병렬 브랜치의 V{타임스탬프} 파일이 병합 순서와 달라도 적용

api:
  prefix: /api/simulation

jwt:
  public-key: ${JWT_PUBLIC_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:animal}?currentSchema=simulation
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
