server:
  port: 8082

spring:
  application:
    name: notification
  profiles:
    default: local
  config:
    # backend/.env (bootRun은 모듈 폴더, IDE는 backend 폴더에서 실행될 수 있어 둘 다 시도)
    import: optional:file:.env[.properties],optional:file:../.env[.properties],classpath:common.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: core   # 명세 Q420 D: chat·notification은 core 스키마를 공유하고 테이블은 core-api Flyway가 만든다
        jdbc:
          time_zone: Asia/Seoul

api:
  prefix: /api/notification

jwt:
  public-key: ${JWT_PUBLIC_KEY}

# FCM 서비스 계정 키 JSON 원문(SealedSecret notification-secrets). 비어 있으면 발송 대신 로그만 남긴다
fcm:
  credentials: ${FIREBASE_CREDENTIALS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:animal}?currentSchema=core
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
