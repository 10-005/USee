# 백엔드 CI
#   MR(→ develop-backend): backend:test 로 컴파일·테스트. 실패하면 머지 불가 (파이프라인 성공 필수 설정)
#   develop-backend 에 머지되면 (테스트는 MR 파이프라인에서 이미 통과했으므로 다시 돌리지 않는다)
#   1) 바뀐 서비스의 이미지를 빌드해 자체 레지스트리에 push  (태그 = 커밋 짧은 SHA)
#      Docker 빌드 안의 Gradle은 빌드 캐시(gradle.properties)를 BuildKit 캐시에 두고 서비스끼리 공유한다
#      → 먼저 빌드한 서비스가 컴파일한 common·안 바뀐 모듈은 다시 컴파일하지 않는다
#   2) infra 브랜치의 overlays/dev/kustomization.yaml newTag 를 그 SHA로 커밋 → ArgoCD 가 배포
# 필요한 CI 변수 (Settings → CI/CD → Variables, Masked and hidden + Protected):
#   REGISTRY_CI_PASSWORD : 레지스트리 ci 계정 비밀번호
#   INFRA_PUSH_TOKEN     : infra 브랜치 push 용 프로젝트 액세스 토큰 (read/write_repository)

variables:
  REGISTRY: k15d106.p.ssafy.io
  INFRA_REPO: lab.ssafy.com/s15-final/S15P31D106.git

# ---------- 공통 작업 틀 ----------

.build-image:
  stage: build
  image: docker:29-cli
  # Runner 가 노드 2 의 Docker(/var/run/docker.sock)를 그대로 쓴다 → 빌드 캐시가 작업 사이에 남음
  script:
    - echo "$REGISTRY_CI_PASSWORD" | docker login "$REGISTRY" -u ci --password-stdin
    - docker build -f "backend/$SERVICE/Dockerfile" -t "$REGISTRY/animal/$SERVICE:$CI_COMMIT_SHORT_SHA" backend
    - docker push "$REGISTRY/animal/$SERVICE:$CI_COMMIT_SHORT_SHA"
  after_script:
    - docker logout "$REGISTRY" || true
    # 노드 2 디스크(30GB) 보호: 올린 이미지 태그는 지우고, 쓰지 않는 이미지 정리 (빌드 캐시는 유지)
    - docker image rm "$REGISTRY/animal/$SERVICE:$CI_COMMIT_SHORT_SHA" || true
    - docker image prune -f || true

.deploy-tag:
  stage: deploy
  image: alpine:3.22
  script:
    - apk add --no-cache git
    - git config --global user.name "s15p31d106-ci"
    - git config --global user.email "ci@k15d106.p.ssafy.io"
    - git clone --depth 5 --branch infra --single-branch "https://ci:${INFRA_PUSH_TOKEN}@${INFRA_REPO}" infra-repo
    - cd infra-repo
    - KFILE="infra/services/$SERVICE/overlays/dev/kustomization.yaml"
    # ": " 가 들어간 명령은 YAML 이 키·값으로 오해하므로 블록(|)으로 감싼다
    - |
      sed -i "s|newTag: .*|newTag: \"$CI_COMMIT_SHORT_SHA\"|" "$KFILE"
    - git add "$KFILE"
    - |
      if git diff --cached --quiet; then
        echo "태그 변경 없음 ($CI_COMMIT_SHORT_SHA)"; exit 0
      fi
    # 팀 커밋 규칙: 제목 → 빈 줄 → "- " 본문 → 빈 줄 → 이슈 번호
    - |
      printf 'chore: deploy %s %s\n\n- 원본 커밋: %s\n- 파이프라인: %s\n\nS15P31D106-301\n' \
        "$SERVICE" "$CI_COMMIT_SHORT_SHA" "$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA" "$CI_PIPELINE_URL" \
        | git commit -F -
    # 다른 서비스 배포 커밋과 겹치면 rebase 후 재시도 (최대 3번)
    - |
      for i in 1 2 3; do
        if git push origin infra; then exit 0; fi
        git pull --rebase origin infra
      done
      exit 1

# ---------- 테스트 (backend 전체, MR 전용) ----------

# common 을 모든 서비스가 쓰므로 서비스별로 나누지 않고 전체 모듈을 한 번에 컴파일·테스트한다
# 빌드 캐시 결과도 .gradle-home/caches/ 에 함께 저장돼, 안 바뀐 모듈의 컴파일·테스트는 다음 MR에서 건너뛴다
# Protected 변수(REGISTRY_CI_PASSWORD, INFRA_PUSH_TOKEN)는 쓰지 않는다
backend:test:
  stage: test
  image: eclipse-temurin:21.0.12.1_1-jdk
  interruptible: true # 새 커밋이 push 되면 이전 파이프라인의 테스트는 취소
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home # GitLab cache 는 프로젝트 폴더 안만 저장 가능
  cache:
    key:
      files:
        - backend/gradle/libs.versions.toml
        - backend/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  script:
    - cd backend
    - ./gradlew build --no-daemon
  artifacts:
    when: always # 테스트가 실패해도 결과를 MR 화면에 올린다
    reports:
      junit: backend/*/build/test-results/test/TEST-*.xml
  rules:
    # develop-backend 대상 MR은 경로와 상관없이 항상 실행 (문서만 바꾼 MR도 파이프라인이 생겨야 머지 가능)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-backend"
    # 머지 후(develop-backend push)에는 돌리지 않는다. MR 생성 뒤 develop-backend가 바뀌었다면 합친 결과는 테스트 없이 배포될 수 있다
    # 필요하면 화면에서 수동 실행(web)으로 돌린다
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop-backend"

# ---------- core-api ----------

# 경로 필터: core-api 자체, 공통 모듈, 빌드 설정, CI 파일이 바뀐 경우에만
.core-api-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-backend"
      changes:
        - backend/core-api/**/*
        - backend/common/**/*
        - backend/gradle/**/*
        - backend/*.gradle.kts
        - backend/gradle.properties
        - backend/gradlew
        - backend/.gitlab-ci.yml
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop-backend"

core-api:build:
  extends: [.build-image, .core-api-rules]
  variables:
    SERVICE: core-api

core-api:deploy:
  extends: [.deploy-tag, .core-api-rules]
  needs: ["core-api:build"]
  variables:
    SERVICE: core-api

# ---------- chat ----------

.chat-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-backend"
      changes:
        - backend/chat/**/*
        - backend/common/**/*
        - backend/gradle/**/*
        - backend/*.gradle.kts
        - backend/gradle.properties
        - backend/gradlew
        - backend/.gitlab-ci.yml
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop-backend"

chat:build:
  extends: [.build-image, .chat-rules]
  variables:
    SERVICE: chat

chat:deploy:
  extends: [.deploy-tag, .chat-rules]
  needs: ["chat:build"]
  variables:
    SERVICE: chat

# ---------- notification ----------

.notification-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-backend"
      changes:
        - backend/notification/**/*
        - backend/common/**/*
        - backend/gradle/**/*
        - backend/*.gradle.kts
        - backend/gradle.properties
        - backend/gradlew
        - backend/.gitlab-ci.yml
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop-backend"

notification:build:
  extends: [.build-image, .notification-rules]
  variables:
    SERVICE: notification

notification:deploy:
  extends: [.deploy-tag, .notification-rules]
  needs: ["notification:build"]
  variables:
    SERVICE: notification

# ---------- simulation ----------

.simulation-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-backend"
      changes:
        - backend/simulation/**/*
        - backend/common/**/*
        - backend/gradle/**/*
        - backend/*.gradle.kts
        - backend/gradle.properties
        - backend/gradlew
        - backend/.gitlab-ci.yml
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop-backend"

simulation:build:
  extends: [.build-image, .simulation-rules]
  variables:
    SERVICE: simulation

simulation:deploy:
  extends: [.deploy-tag, .simulation-rules]
  needs: ["simulation:build"]
  variables:
    SERVICE: simulation
