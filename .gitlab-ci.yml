# 루트 CI: 영역별 파이프라인을 모은다 (backend/web/mobile/ai 는 각 폴더의 .gitlab-ci.yml)
stages:
  - build
  - deploy

# develop-* 브랜치에 push 됐을 때와, 화면에서 수동 실행했을 때만 파이프라인을 만든다
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^develop-/
    - if: $CI_PIPELINE_SOURCE == "web"

include:
  - local: backend/.gitlab-ci.yml
